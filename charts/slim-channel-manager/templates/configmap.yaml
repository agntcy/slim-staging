apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "channel-manager.fullname" . }}
  labels:
    {{- include "channel-manager.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- if .Values.overrideConfig }}
    {{- tpl (toYaml .Values.overrideConfig) . | nindent 4 }}
    {{- else }}
    {{- $config := deepCopy .Values.config }}
    {{- /* The default auth block carries an empty shared-secret. Helm merges
           maps, so it survives into a spire config and emits secret: "".
           Drop it whenever the credential is not a shared secret. */}}
    {{- $auth := (get $config "channel-manager").auth }}
    {{- if and $auth (ne ($auth.type | toString) "shared_secret") }}
    {{- $_ := unset $auth "secret" }}
    {{- end }}
    {{- if .Values.persistence.enabled }}
    {{- $p := .Values.persistence }}
    {{- $persistenceCfg := dict "delete-sessions-on-shutdown" $p.deleteSessionsOnShutdown }}
    {{- if $p.path.envVar }}
    {{- $_ := set $persistenceCfg "path" (printf "${env:%s}" $p.path.envVar) }}
    {{- else }}
    {{- $_ := set $persistenceCfg "path" $p.path.value }}
    {{- end }}
    {{- if $p.insecure }}
    {{- $_ := set $persistenceCfg "insecure" true }}
    {{- else if $p.encryptionPassphrase.value }}
    {{- $_ := set $persistenceCfg "encryption-passphrase" $p.encryptionPassphrase.value }}
    {{- else if $p.encryptionPassphrase.envVar }}
    {{- $_ := set $persistenceCfg "encryption-passphrase" (printf "${env:%s}" $p.encryptionPassphrase.envVar) }}
    {{- else if $p.encryptionPassphrase.secretRef.name }}
    {{- $_ := set $persistenceCfg "encryption-passphrase" "${env:CM_PASSPHRASE}" }}
    {{- end }}
    {{- $cm := get $config "channel-manager" }}
    {{- $_ := set $cm "persistence" $persistenceCfg }}
    {{- end }}
    {{- tpl (toYaml $config) . | nindent 4 }}
    {{- end }}
