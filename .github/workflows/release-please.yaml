---
name: Release please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or land release PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # slim uses a PAT here, but this repo has no repo secrets of its own and
      # the automation app already holds contents:write and pull_requests:write.
      - name: Authenticate with GitHub App Bot
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}

      # Bumps each chart's Chart.yaml and CHANGELOG from conventional commits,
      # then tags helm-<chart>-v<version> on merge, which is what the release
      # workflow listens for.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-config.json
          manifest-file: .github/release-manifest.json
