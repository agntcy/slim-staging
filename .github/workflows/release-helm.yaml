---
name: Release Helm chart

on:
  push:
    tags:
      - 'helm-*'
  # Lets the publish path be exercised without burning a tag. dry_run stops
  # before the push, so it is safe to run against an already-released version.
  workflow_dispatch:
    inputs:
      chart:
        description: Chart directory under charts/
        required: true
        type: choice
        options:
          - slim
          - slim-control-plane
          - slim-channel-manager
          - slim-spire
      version:
        description: Version to publish, e.g. v2.0.1
        required: true
        type: string
      dry_run:
        description: Authenticate and package, but do not push
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The charts publish under ghcr.io/agntcy/slim/helm, whose packages are
      # owned by the slim repo. The default GITHUB_TOKEN is scoped to this
      # repo and cannot write them, so authenticate as the automation app.
      - name: Authenticate with GitHub App Bot
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to slim, not the whole org. GHCR resolves a package's
          # permissions through the repository that owns it, and an org-wide
          # token does not pin one, which is what the 403 looked like.
          repositories: slim

      # What the app can actually reach. A 403 on push is an authorization
      # failure, not an authentication one, so the useful question is whether
      # the installation covers the repo that owns the package.
      - name: Report app access and permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLIENT_ID: ${{ secrets.PROJECT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.PROJECT_APP_KEY }}
        run: |
          {
            echo "### App installation access"
            echo '```'
            echo "repositories the installation covers:"
            gh api /installation/repositories --jq '.repositories[].full_name' 2>&1 | sed 's/^/  /' || true

            # The app's granted permissions are only visible via GET /app,
            # which needs a JWT signed with the private key rather than the
            # installation token.
            b64() { base64 | tr -d '\n=' | tr '+/' '-_'; }
            now=$(date +%s)
            hdr=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
            pld=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$CLIENT_ID" | b64)
            key=$(mktemp); printf '%s' "$PRIVATE_KEY" > "$key"
            sig=$(printf '%s.%s' "$hdr" "$pld" | openssl dgst -sha256 -sign "$key" -binary | b64)
            rm -f "$key"
            echo "app permissions:"
            curl -sS -H "Authorization: Bearer ${hdr}.${pld}.${sig}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/app \
              | jq -r 'if .permissions then (.permissions | to_entries[] | "  \(.key): \(.value)") else "  \(.message // .)" end' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # App installation tokens are presented as x-access-token. Using a
          # human login here is what an anonymous-looking GHCR token reply
          # pointed at.
          username: x-access-token
          password: ${{ steps.app-token.outputs.token }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "3.12.1"

      # Tags look like helm-<chart>-v<version>, e.g. helm-slim-v2.2.0. On a
      # manual run the chart and version come from the inputs instead.
      - name: Resolve chart name and version
        id: chart
        env:
          EVENT: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_CHART: ${{ inputs.chart }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            name="$INPUT_CHART"
            version="$INPUT_VERSION"
          else
            chart_tag="${GITHUB_REF_NAME#helm-}"
            name="${chart_tag%-v*}"
            version="v${chart_tag##*-v}"
          fi
          if [ ! -d "charts/$name" ]; then
            echo "no chart at charts/$name" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # What GHCR will actually grant this token for the target package. The
      # access in the reply is what a push would get, so a missing "push"
      # names the gap without publishing anything.
      - name: Report GHCR granted scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART: ${{ steps.chart.outputs.name }}
        run: |
          pkg="${GITHUB_REPOSITORY_OWNER}/slim/helm/${CHART}"
          {
            echo "### GHCR granted scope for ${pkg}"
            echo '```'
            curl -sS -u "x:${GH_TOKEN}" "https://ghcr.io/token?service=ghcr.io&scope=repository:${pkg}:pull,push" \
              | jq -r '(.token // "") as $t | ($t | split(".")) as $parts | if ($parts | length) < 3 then "  reply carries no JWT -- credentials not recognised, treated as anonymous" else ($parts[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | (.access // [])) | (if length == 0 then "  none granted -- may pull but not push" else (.[] | "  \(.type) \(.name): \(.actions | join(","))") end) end' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Helm lint
        env:
          CHART: ${{ steps.chart.outputs.name }}
        run: |
          # slim-spire vendors spire-lib into each subchart, so the subcharts
          # cannot be linted on their own -- the library only resolves via the
          # parent.
          args=()
          if [ "$CHART" != "slim-spire" ]; then
            args+=("--with-subcharts")
          fi
          helm lint "charts/$CHART" "${args[@]}"

      - name: Helm package
        id: package
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm package "charts/$CHART" --dependency-update --version "$VERSION"
          echo "file=${CHART}-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      # Deliberately the slim path, not slim-staging: it names the product, it
      # is what every install doc already points at, and "staging" in a
      # production install path would be misleading.
      - name: Push to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          FILE: ${{ steps.package.outputs.file }}
        run: |
          helm push "$FILE" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/slim/helm"

      - name: Dry run, not pushed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          FILE: ${{ steps.package.outputs.file }}
        run: echo "packaged $FILE; skipped push (dry_run)" >> "$GITHUB_STEP_SUMMARY"
