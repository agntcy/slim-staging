---
name: Release Helm chart

on:
  push:
    tags:
      - 'helm-*'
  # Lets the publish path be exercised without burning a tag. dry_run stops
  # before the push, so it is safe to run against an already-released version.
  workflow_dispatch:
    inputs:
      chart:
        description: Chart directory under charts/
        required: true
        type: choice
        options:
          - slim
          - slim-control-plane
          - slim-channel-manager
          - slim-spire
      version:
        description: Version to publish, e.g. v2.0.1
        required: true
        type: string
      dry_run:
        description: Authenticate and package, but do not push
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The charts publish under ghcr.io/agntcy/slim/helm, so those packages
      # must grant this repository Write under their Actions access. Every
      # other GHCR push in the org authenticates this way.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "3.12.1"

      # Tags look like helm-<chart>-v<version>, e.g. helm-slim-v2.2.0. On a
      # manual run the chart and version come from the inputs instead.
      - name: Resolve chart name and version
        id: chart
        env:
          EVENT: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_CHART: ${{ inputs.chart }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            name="$INPUT_CHART"
            version="$INPUT_VERSION"
          else
            chart_tag="${GITHUB_REF_NAME#helm-}"
            name="${chart_tag%-v*}"
            version="v${chart_tag##*-v}"
          fi
          if [ ! -d "charts/$name" ]; then
            echo "no chart at charts/$name" >&2
            exit 1
          fi
          # The published artifact takes its version from the tag, so a tag
          # that disagrees with Chart.yaml ships content under a version that
          # does not describe it. That is how slim-spire came to publish SPIRE
          # 1.15.3 as v2.0.0.
          declared=$(awk '/^version:/ {print $2; exit}' "charts/$name/Chart.yaml" | tr -d '"')
          if [ "${version#v}" != "$declared" ]; then
            echo "version mismatch: releasing ${version#v} but charts/$name/Chart.yaml says $declared" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Helm lint
        env:
          CHART: ${{ steps.chart.outputs.name }}
        run: |
          # slim-spire vendors spire-lib into each subchart, so the subcharts
          # cannot be linted on their own -- the library only resolves via the
          # parent.
          args=()
          if [ "$CHART" != "slim-spire" ]; then
            args+=("--with-subcharts")
          fi
          helm lint "charts/$CHART" "${args[@]}"

      - name: Helm package
        id: package
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm package "charts/$CHART" --dependency-update --version "$VERSION"
          echo "file=${CHART}-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      # Deliberately the slim path, not slim-staging: it names the product, it
      # is what every install doc already points at, and "staging" in a
      # production install path would be misleading.
      - name: Push to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          FILE: ${{ steps.package.outputs.file }}
        run: |
          helm push "$FILE" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/slim/helm"

      - name: Dry run, not pushed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          FILE: ${{ steps.package.outputs.file }}
        run: echo "packaged $FILE; skipped push (dry_run)" >> "$GITHUB_STEP_SUMMARY"
